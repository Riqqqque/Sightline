name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain version comes from rust-toolchain.toml.
      - name: Show toolchain
        run: rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      # No game art here: the build falls back to letters and text, which is what a fresh
      # checkout gets too.
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
